<evt-panel [showSecondaryContent]="isSecondaryContentShown()" 
           (scrollContent)="updatePageFromScroll$.next()" 
           (click)="onPanelClicked($event)">
    <div header-left class="no-drag d-flex align-items-center">
        <evt-button
            ariaLabel="{{ 'ariaLabels.openInfoTab' | translate }}"
            aria-role="button"
            label="Info"
            [iconLeft]="{icon: 'info-circle', additionalClasses: 'me-1'}"
            additionalClasses="btn-primary me-1"
            (btnClick)="toggleSecondaryContent('info')"
            [active]="secondaryContent === 'info'"></evt-button>
        <evt-edition-selector></evt-edition-selector>
        <evt-page-selector [pageID]="pageID" (selectionChange)="updatePage$.next($event)"></evt-page-selector>
        <evt-edition-level-selector [class.hidden]="hideEditionLevelSelector" [editionLevelID]="editionLevelID" (selectionChange)="currentEdLevel$.next($event)"></evt-edition-level-selector>
        <evt-change-layer-selector [class.hidden]="!(showChangeLayerSelector)" [selLayer]="selLayer" (layerChange)="updateSelectedLayer($event)"></evt-change-layer-selector>
    </div>
    <div content evtAnnotator #mainContent
        [evtTextSearchHighlight]="textSearchRegExp"
        [textSearchFocus]="textSearchFocus"
        (textSearchMatchesChange)="textSearchMatches = $event">
        <ng-container *ngIf="(currentStatus$ | async) as currentStatus">
            <ng-container *ngIf="isMultiplePageFlow$ | async">
                <evt-page *ngFor="let page of currentStatus.pages"
                    [attr.data-id]="page.id"
                    [data]="page"
                    [textFlow]="textFlow"
                    [withDeletions]="showDeletions"
                    [selectedLayer]="selectedLayer"
                    [itemsToHighlight]="itemsToHighlight$ | async"></evt-page>
            </ng-container>
            <evt-page *ngIf="(isMultiplePageFlow$ | async) === false"
                [attr.data-id]="currentStatus.currentPage.id"
                [data]="currentStatus.currentPage"
                [editionLevel]="currentStatus.editionLevel"
                [textFlow]="textFlow"
                [withDeletions]="showDeletions"
                [selectedLayer]="selectedLayer"
                [itemsToHighlight]="itemsToHighlight$ | async"></evt-page>
        </ng-container>
    </div>
    <div secondary-content>
        <ng-container [ngSwitch]="secondaryContent">

            <ng-container *ngSwitchCase="'info'">
                <evt-content-viewer
                *ngIf="front; else noFront"
                [mouseCapture]="true"
                [content]="front">
                </evt-content-viewer>

                <ng-template #noFront>
                    This edition has no <span class="fw-bold">front</span> content
                </ng-template>
            </ng-container>

            <ng-container *ngSwitchCase="'search'">
                <div class="text-search-results" *ngIf="textSearchResults as results">
                    <div class="fw-bold">
                        <ng-container *ngIf="results.total; else noTextSearchResults">
                            {{ 'textSearchResults' | translate: { count: results.total, query: results.query } }}
                            <span *ngIf="results.total > results.items.length" class="fw-normal">
                                ({{ 'textSearchResultsLimited' | translate: { limit: results.items.length } }})
                            </span>
                        </ng-container>
                        <ng-template #noTextSearchResults>{{ 'noMatches' | translate }}</ng-template>
                    </div>
                    <evt-hr class="d-block my-2"></evt-hr>
                    <ul class="text-search-results-list mb-0">
                        <li *ngFor="let result of results.items">
                            <button type="button" class="btn btn-link text-search-result" (click)="goToSearchResult(result)">
                                <span class="text-search-result-page">{{ 'page' | translate: { value: result.page.label } }}</span>
                                <span>{{ result.before }}<mark>{{ result.match }}</mark>{{ result.after }}</span>
                            </button>
                        </li>
                    </ul>
                </div>
            </ng-container>

            <ng-container *ngSwitchDefault>
                Unsupported content
            </ng-container>

            </ng-container>
    </div>

    <div footer class="d-flex align-items-center" >
        <evt-button
            ariaLabel="{{ 'ariaLabels.searchInText' | translate }}"
            aria-role="button"
            [iconLeft]="{icon: 'search'}"
            [label]="'search' | translate"
            additionalClasses="me-1"
            (btnClick)="toggleTextSearch()"
            [active]="textSearchOpen">
        </evt-button>
        <div *ngIf="textSearchOpen" class="text-search me-1">
            <!-- keyup is stopped so that arrow keys move the caret instead of changing page (see PageSelectorComponent) -->
            <input #textSearchInput type="text" class="form-control"
                [class.invalid]="textSearchError"
                [(ngModel)]="textSearchQuery"
                (ngModelChange)="onTextSearchChange()"
                (keydown.enter)="searchInAllPages()"
                (keydown.escape)="onTextSearchEscape()"
                (keyup)="$event.stopPropagation()"
                [placeholder]="'searchInText' | translate"
                [title]="textSearchError ?? ('searchInTextHint' | translate)"
                [attr.aria-label]="'ariaLabels.searchInText' | translate"
                [attr.aria-invalid]="!!textSearchError">
            <span *ngIf="textSearchRegExp" class="text-search-count">{{ textSearchMatches }}</span>
            <!-- mousedown is prevented to keep the focus in the input -->
            <button type="button" class="text-search-regexp"
                [class.active]="textSearchIsRegExp"
                [attr.aria-pressed]="textSearchIsRegExp"
                [title]="'useRegularExpression' | translate"
                [attr.aria-label]="'useRegularExpression' | translate"
                (mousedown)="$event.preventDefault()"
                (click)="toggleTextSearchRegExp()">Regex</button>
        </div>
        <evt-entities-select (selectionChange)="itemsToHighlight$.next($event)"></evt-entities-select>
        <evt-verse-prose-select *ngIf="enableProseVersesToggler" (textModeSelectionChange)="toggleProseVerses($event)"></evt-verse-prose-select>
        <evt-button *ngIf="enableHideDeletionsToggler"
            ariaLabel="{{ 'ariaLabels.hideDeletionsFromText' | translate }}"
            aria-role="button"
            [iconLeft]="hideDeletionsTogglerIcon"
            [label]="'showsDeletions' | translate "
            [active]="showDeletions"
            additionalClasses="ms-1"
            (btnClick)="toggleHideDeletions()">
        </evt-button>
    </div>
</evt-panel>
