<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>EvtViewerAngular</title>
  <base href="./">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="stylesheet" href="assets/config/custom-styles.css">
  <style>
    #evt-boot-loader {
      position: fixed;
      inset: 0;
      z-index: 100000;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      justify-content: center;
      background-color: rgba(51, 51, 51, 0.8);
      transition: opacity 0.3s ease;
    }
    #evt-boot-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }
    #evt-boot-loader .evt-boot-spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.25);
      border-top-color: #fff;
      border-radius: 50%;
      animation: evt-boot-spin 0.8s linear infinite;
    }
    #evt-boot-loader .evt-boot-text {
      min-height: 1.5em;
      color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 1rem;
      letter-spacing: 0.02em;
    }
    @keyframes evt-boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <evt-root></evt-root>
  <div id="evt-boot-loader" role="status" aria-live="polite">
    <div class="evt-boot-spinner"></div>
    <div class="evt-boot-text"></div>
  </div>
</body>
</html>
